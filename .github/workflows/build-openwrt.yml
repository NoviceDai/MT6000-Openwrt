#############################################################################################
##  MT6000 OpenWrt 编译流水线
##  v3.3 2026/10/28
##  变更：删除无用的 "Install Go 1.25" 步骤（OpenWrt 用自带 golang-bootstrap 自举，
##        不依赖系统 go）；删除多余的 docker image prune 与失效的 make depend；
##        清理编译步里指向系统 go 的 PATH/GOTOOLCHAIN 注入。
##  历史：v3.2 配置校验 / 下载重试 / 状态回写 build-status；v3.1 seed.config 增量配置。
#############################################################################################

name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: '编译输出完整命令 (V=s)，日志巨大，仅排障时开启'
        type: boolean
        default: false
      dry_run:
        description: '只校验配置不编译（约 10 分钟）'
        type: boolean
        default: false
  repository_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DIY_P3_SH: diy-part3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  REMOVE_ARTIFACTS: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUILD_LOG: /workdir/build.log
  DEVICE_NAME:
  FILE_DATE:
  FIRMWARE:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 400
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@v4

    - name: Job clock
      run: echo "JOB_STARTED=$(date -u +%s)" >> $GITHUB_ENV

    - name: Initialization environment
      id: environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential clang flex g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip zlib1g-dev ccache rsync swig unzip file wget libelf-dev python3-distutils bzip2 cmake cpio curl device-tree-compiler fastjar gperf haveged help2man intltool libc6-dev-i386 libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncursesw5-dev libpython3-dev libreadline-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3-pyelftools python3-setuptools qemu-utils scons squashfs-tools subversion texinfo uglifyjs upx-ucl vim xmlto xxd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      id: source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      id: feeds1
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      id: feeds2
      run: cd openwrt && ./scripts/feeds update -a

    - name: Change default package
      id: feeds3
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install feeds
      id: feeds4
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load custom configuration
      id: config
      run: |
        [ -e files ] && mv files openwrt/files
        # 优先使用 seed.config（增量配置，推荐），否则回退到完整 .config
        if [ -e seed.config ]; then
          cp seed.config openwrt/.config
          echo "CONFIG_SRC=$GITHUB_WORKSPACE/seed.config" >> $GITHUB_ENV
          echo "::notice::配置模式：seed.config（增量）"
        elif [ -e $CONFIG_FILE ]; then
          cp $CONFIG_FILE openwrt/.config
          echo "CONFIG_SRC=$GITHUB_WORKSPACE/$CONFIG_FILE" >> $GITHUB_ENV
          echo "::notice::配置模式：$CONFIG_FILE（完整）"
        fi
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: Prepare config
      id: prepare
      run: |
        cd openwrt
        make defconfig
        echo "总选中包数: $(grep -c '^CONFIG_PACKAGE_.*=y$' .config)"

    - name: Verify config
      id: verify
      run: |
        cd openwrt
        SRC="${CONFIG_SRC:-$GITHUB_WORKSPACE/.config}"
        echo "配置校验来源: $SRC"
        total=0; miss=0; miss_list=""
        while IFS= read -r line; do
          sym="${line%%=*}"
          total=$((total+1))
          if ! grep -qxF "${sym}=y" .config; then
            miss=$((miss+1)); miss_list="$miss_list ${sym}"
            echo "::error title=配置未生效::${sym} 在 make defconfig 后被关闭（包名错误或依赖不满足）"
          fi
        done < <(grep -E '^CONFIG_[A-Za-z0-9_.-]+=y$' "$SRC" || true)
        echo "CONFIG_CHECKED=$total" >> $GITHUB_ENV
        echo "CONFIG_MISSING=$miss" >> $GITHUB_ENV
        echo "CONFIG_MISSING_LIST=$miss_list" >> $GITHUB_ENV
        echo "校验完成：共 $total 项，缺失 $miss 项"
        if [ "$miss" -ne 0 ]; then
          {
            echo "### ❌ 配置校验失败"
            echo ""
            echo "以下符号在 \`make defconfig\` 后被关闭，固件里不会有它们："
            echo ""
            for s in $miss_list; do echo "- \`$s\`"; done
            echo ""
            echo "常见原因：包名写错、包不在已加载的 feed 里、依赖不满足（缺 kmod 或版本不兼容）。"
          } >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    # 心跳：过校验后先写一条 running 状态，便于外部区分"在编译"和"没触发"
    - name: Report heartbeat
      if: steps.verify.outcome == 'success' && !cancelled()
      continue-on-error: true
      run: |
        python3 - <<'PY'
        import json, os, datetime
        env = os.environ
        s = {
            "conclusion": "running",
            "stage": "已通过配置校验，开始下载/编译",
            "sha": env.get("GITHUB_SHA"),
            "run_id": env.get("GITHUB_RUN_ID"),
            "run_number": env.get("GITHUB_RUN_NUMBER"),
            "run_url": "https://github.com/%s/actions/runs/%s" % (env.get("GITHUB_REPOSITORY"), env.get("GITHUB_RUN_ID")),
            "version": env.get("REPO_BRANCH"),
            "dry_run": env.get("DRY_RUN") == "true",
            "config_checked": env.get("CONFIG_CHECKED"),
            "heartbeat_at": datetime.datetime.now(datetime.timezone.utc).astimezone().isoformat(),
        }
        with open(os.path.join(env["GITHUB_WORKSPACE"], "status.json"), "w") as f:
            json.dump(s, f, ensure_ascii=False, indent=2)
        print(json.dumps(s, ensure_ascii=False))
        PY
        cd $GITHUB_WORKSPACE
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B build-status
        git rm -r --cached . -q >/dev/null 2>&1 || true
        git add -f status.json
        git commit -q -m "running ${GITHUB_RUN_NUMBER}"
        git push -f -q origin build-status && echo "心跳已写入 build-status"

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo -e "MyMark ... Downloading packages....."
        set -o pipefail
        for i in 1 2 3; do
          if make download -j8 2>&1 | tee -a $BUILD_LOG; then
            echo "::notice::源码包下载完成（第 $i 次尝试）"
            break
          fi
          echo "::warning::make download 第 $i 次失败，清理 1KB 以下残留后重试"
          find dl -size -1024c -exec rm -f {} \; || true
          sleep 5
        done
        echo -e "Check downloaded files..."
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      if: github.event.inputs.dry_run != 'true'
      run: |
        cd openwrt
        VERBOSE=""
        [ "${{ github.event.inputs.verbose }}" = "true" ] && VERBOSE="V=s"
        echo -e "MyMark ... $(nproc) thread compile..."
        set -o pipefail
        if make -j$(nproc) $VERBOSE 2>&1 | tee $BUILD_LOG; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          failed_pkg=$(grep -oE 'ERROR: package/[^ ]+ failed to build' $BUILD_LOG | head -1 | sed -e 's|^ERROR: package/||' -e 's| failed to build$||')
          if [ -n "$failed_pkg" ]; then
            echo "::warning::编译失败于 $failed_pkg，用 V=s 单线程重跑该包获取详细错误"
            make "package/$failed_pkg/clean" "package/$failed_pkg/compile" V=s -j1 2>&1 | tee -a $BUILD_LOG || true
          else
            echo "::warning::编译失败且未定位到具体包，用 V=s 单线程全量重跑"
            make -j1 V=s 2>&1 | tee -a $BUILD_LOG || true
          fi
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Get device name
      id: device
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_([^=]+)=y/\1/' | head -1)
        echo "DEVICE_NAME=_${DEVICE}" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        echo "=== Checking output directory ==="
        ls -la openwrt/bin/targets/mediatek/filogic/
        echo "=== Finding all firmware files ==="
        find openwrt/bin/targets/mediatek/filogic -type f \( -name "*.bin" -o -name "*.img" -o -name "*.itb" \) | head -20
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/*mt6000*
        if-no-files-found: warn
        retention-days: 3

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "OpenWrt MT6000 Firmware - $(date +"%Y.%m.%d")"
          echo ""
          echo "- 源码分支: $REPO_BRANCH"
          echo "- 设备: ${DEVICE_NAME#_}"
          echo "- 配置项: $(grep -c '^CONFIG_PACKAGE_.*=y$' openwrt/.config) 个包"
          echo "- 提交: ${GITHUB_SHA:0:7}"
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: release
      if: steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success'
      run: |
        gh release create "${{ steps.tag.outputs.release_tag }}" --title "OpenWrt MT6000 - ${{ steps.tag.outputs.release_tag }}" --notes-file release.txt
        for f in "${{ env.FIRMWARE }}"/*glinet*mt6000* "${{ env.FIRMWARE }}"/*gl-mt6000* "${{ env.FIRMWARE }}"/*mt6000*; do
          [ -f "$f" ] && gh release upload "${{ steps.tag.outputs.release_tag }}" "$f" --clobber
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      if: steps.compile.outputs.status == 'success'
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 4

    - name: Remove old Releases
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | awk 'NR>5'); do
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ------------------------------------------------------------------
    # 编译状态回写：技能通过 ssh 读 build-status 分支即可拿到结果，
    # 无需 GitHub PAT（API 匿名额度不可靠）。
    # ------------------------------------------------------------------
    - name: Publish build status
      if: always()
      continue-on-error: true
      env:
        OUTCOMES: "checkout=${{ steps.checkout.outcome }};environment=${{ steps.environment.outcome }};source=${{ steps.source.outcome }};feeds1=${{ steps.feeds1.outcome }};feeds2=${{ steps.feeds2.outcome }};feeds3=${{ steps.feeds3.outcome }};feeds4=${{ steps.feeds4.outcome }};config=${{ steps.config.outcome }};prepare=${{ steps.prepare.outcome }};verify=${{ steps.verify.outcome }};package=${{ steps.package.outcome }};compile=${{ steps.compile.outcome }};organize=${{ steps.organize.outcome }};release=${{ steps.release.outcome }}"
        RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: |
        python3 - <<'PY'
        import json, os, re, glob, datetime
        from collections import deque

        env = os.environ
        outcomes = {}
        for pair in env.get("OUTCOMES", "").split(";"):
            if "=" in pair:
                k, v = pair.split("=", 1)
                outcomes[k.strip()] = v.strip() or "skipped"

        order = ["checkout", "environment", "source", "feeds1", "feeds2",
                 "feeds3", "feeds4", "config", "prepare", "verify", "package",
                 "compile", "organize", "release"]
        failed = next((s for s in order if outcomes.get(s) == "failure"), None)
        cancelled = any(v == "cancelled" for v in outcomes.values())
        if failed:
            conclusion = "failure"
        elif cancelled:
            conclusion = "cancelled"
        else:
            conclusion = "success"

        # 从编译日志里提取错误行（流式读取，避免大日志撑爆内存）
        errors, tail = deque(maxlen=40), deque(maxlen=40)
        log = env.get("BUILD_LOG", "/workdir/build.log")
        pat = re.compile(
            r"(make(\[\d+\])?: \*\*\*|^ERROR:|error:|Error \d+\s*$|Collected errors|"
            r"missing dependenc|No space left|Killed|fatal error|undefined reference|"
            r"No rule to make target|checksum mismatch|Segmentation fault|"
            r"Cannot allocate memory|No such file or directory|"
            r"requires [Gg]o >=|go: download|go: error|go\.mod requires|"
            r"note: module requires Go)", re.I)
        if os.path.exists(log):
            with open(log, errors="ignore") as f:
                for line in f:
                    line = line.rstrip("\n")
                    tail.append(line)
                    if pat.search(line):
                        errors.append(line[:400])

        # 固件产物
        firmware = []
        for base in ("/workdir/openwrt", os.path.join(env.get("GITHUB_WORKSPACE", ""), "openwrt")):
            hits = glob.glob(os.path.join(base, "bin/targets/*/*/*mt6000*"))
            if hits:
                for p in hits:
                    try:
                        firmware.append({"name": os.path.basename(p), "size": os.path.getsize(p)})
                    except OSError:
                        pass
                break

        started = env.get("JOB_STARTED")
        try:
            duration = int(datetime.datetime.now().timestamp() - int(started)) if started else None
        except (TypeError, ValueError):
            duration = None

        status = {
            "conclusion": conclusion,
            "failed_step": failed,
            "outcomes": outcomes,
            "dry_run": env.get("DRY_RUN") == "true",
            "sha": env.get("GITHUB_SHA"),
            "run_id": env.get("GITHUB_RUN_ID"),
            "run_number": env.get("GITHUB_RUN_NUMBER"),
            "run_url": "https://github.com/%s/actions/runs/%s" % (env.get("GITHUB_REPOSITORY"), env.get("GITHUB_RUN_ID")),
            "version": env.get("REPO_BRANCH"),
            "device": (env.get("DEVICE_NAME") or "").lstrip("_") or None,
            "duration_sec": duration,
            "release_tag": env.get("RELEASE_TAG") or None,
            "config_checked": env.get("CONFIG_CHECKED"),
            "config_missing": [x for x in env.get("CONFIG_MISSING_LIST", "").split() if x],
            "firmware": firmware,
            "errors": list(errors),
            "log_tail": list(tail) if conclusion != "success" else [],
            "finished_at": datetime.datetime.now(datetime.timezone.utc).astimezone().isoformat(),
        }
        with open(os.path.join(env["GITHUB_WORKSPACE"], "status.json"), "w") as f:
            json.dump(status, f, ensure_ascii=False, indent=2)
        with open("/tmp/conclusion", "w") as f:
            f.write(conclusion)
        print(json.dumps(status, ensure_ascii=False, indent=2))
        PY

        CONCLUSION=$(cat /tmp/conclusion)
        echo "结论: $CONCLUSION"

        cd $GITHUB_WORKSPACE
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B build-status
        git rm -r --cached . -q >/dev/null 2>&1 || true
        git add -f status.json
        git commit -q -m "build ${GITHUB_RUN_NUMBER}: ${CONCLUSION}" || echo "无变化"
        git push -f -q origin build-status && echo "status.json 已推送到 build-status 分支"
